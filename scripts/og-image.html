<!doctype html>
<!--
  Template for the social preview image (public/og-image.png, 1200x630).
  Regenerate with:  npm run og
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Instrument Serif';
        src: url('../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Instrument Serif';
        font-style: italic;
        src: url('../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2');
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0b0b0c;
        color: #edece7;
        font-family: 'Instrument Serif', Georgia, serif;
        position: relative;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgb(255 255 255 / 0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgb(255 255 255 / 0.04) 1px, transparent 1px);
        background-size: 70px 70px;
        mask-image: radial-gradient(ellipse 80% 80% at 70% 20%, #000 20%, transparent 78%);
      }
      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 50% 55% at 80% 20%, rgb(226 178 89 / 0.16), transparent 70%);
      }
      .content {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 84px;
      }
      .label {
        font-family: 'Geist Mono', monospace;
        font-size: 19px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #e2b259;
      }
      h1 {
        margin-top: 26px;
        font-weight: 400;
        font-size: 150px;
        line-height: 0.9;
        letter-spacing: -0.02em;
      }
      .tagline {
        margin-top: 36px;
        font-size: 40px;
        line-height: 1.15;
      }
      .tagline em {
        color: #e2b259;
      }
      .school {
        margin-top: 30px;
        font-family: 'Geist Mono', monospace;
        font-size: 18px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #a8a69f;
      }
      .portrait {
        position: relative;
        width: 330px;
        flex-shrink: 0;
      }
      .portrait::before {
        content: '';
        position: absolute;
        inset: -14px -14px 14px 14px;
        border: 1px solid rgb(226 178 89 / 0.35);
        border-radius: 8px;
      }
      .portrait img {
        position: relative;
        display: block;
        width: 100%;
        aspect-ratio: 4 / 5;
        object-fit: cover;
        border: 1px solid #34343a;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="content">
      <div>
        <p class="label">Software Engineering Student</p>
        <h1>Owen<br />Fennell</h1>
        <p class="tagline">Building software. Solving problems.<br /><em>Always learning.</em></p>
        <p class="school">Iowa State University &nbsp;·&nbsp; Class of 2028</p>
      </div>
      <div class="portrait">
        <img src="../src/assets/img/headshot-lg.webp" alt="" />
      </div>
    </div>
  </body>
</html>
